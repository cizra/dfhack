name: Build and test

on: [push, pull_request]

jobs:
  build-linux:
    name: Build and run C++ tests (Linux, GCC 12, CMake 4)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-12 \
            g++-12 \
            libgtk2.0-0 \
            libsdl-image1.2-dev \
            libsdl-ttf2.0-dev \
            libsdl1.2-dev \
            libxml-libxml-perl \
            libxml-libxslt-perl \
            ninja-build \
            zlib1g-dev
          python -m pip install "cmake>=4,<5"

      - name: Configure
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          cmake \
            -S . \
            -B build-ci \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build-ci/image" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build-ci --parallel

      - name: Run C++ tests
        run: ctest --test-dir build-ci --output-on-failure

      - name: Install
        run: cmake --install build-ci

      - name: Package test build
        run: tar cjf dfhack-test-build.tar.bz2 -C build-ci/image .

      - uses: actions/upload-artifact@v4
        with:
          name: dfhack-test-build
          path: dfhack-test-build.tar.bz2

  integration-linux:
    name: Run Lua integration tests (Linux)
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglu1-mesa \
            libgtk2.0-0 \
            libncursesw5 \
            libsdl-image1.2 \
            libsdl-ttf2.0-0 \
            libsdl1.2debian \
            zlib1g

      - name: Download Dwarf Fortress and test save
        env:
          DF_VERSION: 0.47.05
          DF_FOLDER: ${{ runner.temp }}/df_linux
        run: sh ci/download-df.sh

      - uses: actions/download-artifact@v4
        with:
          name: dfhack-test-build

      - name: Install DFHack
        env:
          DF_FOLDER: ${{ runner.temp }}/df_linux
        run: tar xjf dfhack-test-build.tar.bz2 -C "$DF_FOLDER"

      - name: Run Lua integration tests
        env:
          DF_FOLDER: ${{ runner.temp }}/df_linux
          TERM: dumb
        run: python ci/run-tests.py --headless --keep-status "$DF_FOLDER"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/df_linux/df-raw-stderr.log
            ${{ runner.temp }}/df_linux/dfhack-rpc.txt
            ${{ runner.temp }}/df_linux/stderr.log
            ${{ runner.temp }}/df_linux/stdout.log
            ${{ runner.temp }}/df_linux/test*.json
